<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Final Task</title>

    <style>
        body {
            height: 3000px;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: black;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fixed-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 180px;
            background: gray;
        }

        .wrapper {
            margin: 60px;
        }

        .card {
            position: relative;
            display: inline-block;
            width: 260px;
            background: #cfcfcf;
            padding: 20px;
            vertical-align: top;
        }

        .card img {
            width: 100%;
            display: block;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: black;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        .cart {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: none;
            padding: 8px 15px;
        }

        .spacer {
            display: inline-block;
            width: 40px;
        }
    </style>

</head>

<body>

    <div class="close-btn">X</div>

    <div class="wrapper">
        <div class="card">
            <img src="shirt.jpg">
            <div class="badge">20% OFF</div>
        </div>

        <div class="spacer"></div>

        <div class="card">
            <img src="shirt.jpg">
            <div class="badge">20% OFF</div>
            <button class="cart">Add to Cart</button>
        </div>
    </div>

    <div class="fixed-box"></div>

</body>

</html>
