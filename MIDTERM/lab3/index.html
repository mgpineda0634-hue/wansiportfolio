<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>My Form</title>

<body>
    <fieldset>
        <legend style="font-size:20px;">Request Proposal</legend>
        <table>
            <tr>

                <td style="text-align:end;">Your Company:</td>
                <td><input type="text"></td>
            </tr>

            <td style="text-align:end;">Email:</td>
            <td><input type="text"></td>
            </tr>

            <td style="text-align:end;">Username:</td>
            <td><input type="text"></td>
            </tr>

            <td style="text-align:end;">Password:</td>
            <td><input type="text"></td>
            </tr>
            <tr>
                <td style="right top">Your Business:</td>
                <td>
                    <textarea rows="5" cols="40">
    Briefly describe your business in this place
                        </textarea>
                </td>
            </tr>
            <tr>
                <td style="text-align: right;">Company Size</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="radio" name="Company Size">Less than 10</td>
            </tr>
            <tr>
                <td></td>
                <td><input type="radio" name="Company Size">11 to 50</td>
            </tr>
            <tr>
                <td></td>
                <td><input type="radio" name="Company Size">50 to 200</td>
            </tr>
            <tr>
                <td></td>
                <td><input type="radio" name="Company Size">over 200</td>
            </tr>


            <tr>
                <td align="right">Timeline:</td>
                <td>
                    <select>
                        <option></option>
                        <option>Immediateley</option>
                        <option>1-2 weeks</option>
                        <option>3-6 weeks</option>
                        <option>7-12 months</option>
                    </select>
                </td>
            </tr>
            <tr>

                <td></td>
                <td>
                    <input type="submit" value="Send to dev/design" </td>







        </table>
    </fieldset>
</body>

</html>
